<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeamCP</title>
  <meta name="description" content="게임, 일상을 돕는 앱, 이야기를 담은 책을 만드는 작은 스튜디오입니다.">
  <link rel="canonical" href="https://sjw0408.github.io/">
  <link rel="alternate" hreflang="ko" href="https://sjw0408.github.io/">
  <link rel="alternate" hreflang="en" href="https://sjw0408.github.io/en/">
  <link rel="stylesheet" href="/assets/portal/portal.css">
</head>
<body>
  <a href="#main" class="skip">본문으로 건너뛰기</a>
  <header class="wrap header">
    <a class="brand" href="/" aria-label="TeamCP 홈"><span class="mark" aria-hidden="true">CP</span>TeamCP</a>
    <nav class="navigation" aria-label="주 메뉴">
      <a href="/games/">게임</a>
      <a href="/apps/">앱</a>
      <a href="/books/">전자책</a>
      <a href="/support/">고객지원</a>
    </nav>
    <a href="/en/" class="lang" lang="en" hreflang="en" aria-label="Switch to English">EN</a>
  </header>
  <main id="main" class="wrap site-main" tabindex="-1">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">작은 즐거움을<br>만드는 TeamCP</h1>
        <p>게임, 일상을 돕는 앱, 이야기를 담은 책을 만드는 작은 스튜디오입니다.</p>
        <a class="button primary-action" href="/games/">게임 둘러보기 <span aria-hidden="true">→</span></a>
      </div>
      <div class="hero-art" aria-hidden="true"><i class="orbit"></i><i class="token pad"></i><i class="token hero-book"></i><i class="token hero-app"></i><span class="spark">✦</span><span class="spark alt">✧</span></div>
    </section>
    <div class="tiles">
      <a href="/games/" class="tile games">
        <span class="tile-icon" aria-hidden="true">🎮</span>
        <span class="tile-copy"><strong>게임</strong><small>게임 모아보기</small></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="/apps/" class="tile apps">
        <span class="tile-icon" aria-hidden="true"></span>
        <span class="tile-copy"><strong>앱</strong><small>TeamCP가 만든 앱</small></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="/books/" class="tile books">
        <span class="tile-icon" aria-hidden="true"></span>
        <span class="tile-copy"><strong>전자책</strong><small>TeamCP가 펴낸 책</small></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="/support/" class="tile support">
        <span class="tile-icon" aria-hidden="true"></span>
        <span class="tile-copy"><strong>고객지원</strong><small>문의·개인정보</small></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>
    <section id="games" aria-labelledby="games-title">
      <div class="section-head">
        <h2 id="games-title">TeamCP 게임</h2>
        <a class="button secondary-action" href="/games/">전체 게임 보기 <span aria-hidden="true">→</span></a>
      </div>
      <div class="games-grid">
        <a class="game" href="/games/cat-detective/" hreflang="ko">
          <img class="game-icon" src="/games/cat-detective/icon.png" alt="" width="128" height="128">
          <span class="game-copy"><strong>냥탐정</strong><small>장면 속 단서를 찾는 관찰 추리</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="game" href="/games/cat-gomoku/" hreflang="ko">
          <img class="game-icon" src="/games/cat-gomoku/icon.png" alt="" width="128" height="128">
          <span class="game-copy"><strong>고양이 오목</strong><small>한 수씩 생각하는 11×11 오목</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="game" href="/games/slime-express/" hreflang="ko">
          <img class="game-icon" src="/games/slime-express/icon.png" alt="" width="128" height="128">
          <span class="game-copy"><strong>슬라임 택배</strong><small>장애물을 피해 달리는 택배 모험</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>
  <footer class="wrap footer">
    <span>TeamCP</span>
    <div class="footer-links">
      <a href="/support/">고객지원</a>
      <a href="/privacy/" hreflang="ko">개인정보처리방침</a>
    </div>
  </footer>
</body>
</html>
